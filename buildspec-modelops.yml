version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install uv
      - uv sync

  pre_build:
    commands:
      - export RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)
      - echo "Running scheduled ModelOps cycle ${RUN_ID}"
      - echo "MODEL_BUCKET=${MODEL_BUCKET}"
      - echo "INSTANCE_TYPE=${INSTANCE_TYPE}"

  build:
    commands:
      - PYTHONPATH=. uv run python scripts/run_model_flow_aws_jobs.py --role-arn "$SAGEMAKER_ROLE_ARN" --bucket "$MODEL_BUCKET" --region "$AWS_REGION" --instance-type "$INSTANCE_TYPE" --base-prefix "modelops/runs/$RUN_ID" --sales-key "raw/current/sales_train.csv" --test-key "raw/current/test.csv" --items-key "raw/current/items_en.csv" --categories-key "raw/current/item_categories_en.csv" --shops-key "raw/current/shops_en.csv"
      - aws s3 sync "s3://$MODEL_BUCKET/modelops/runs/$RUN_ID/predictions/" "s3://$MODEL_BUCKET/modelops/latest/predictions/"
      - aws s3 sync "s3://$MODEL_BUCKET/modelops/runs/$RUN_ID/evaluation/" "s3://$MODEL_BUCKET/modelops/latest/evaluation/"
      - aws s3 sync "s3://$MODEL_BUCKET/modelops/runs/$RUN_ID/model/" "s3://$MODEL_BUCKET/modelops/latest/model/"
      - aws glue start-crawler --name "$GLUE_CRAWLER_NAME" || true

  post_build:
    commands:
      - echo "Scheduled ModelOps cycle completed"
      - echo "RUN_ID=${RUN_ID}"
      - echo "Latest forecast=s3://$MODEL_BUCKET/modelops/latest/predictions/forecast_detail.parquet"
