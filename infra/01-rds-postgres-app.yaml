AWSTemplateFormatVersion: "2010-09-09"
Description: "RDS PostgreSQL + Secrets Manager for the 1C Streamlit MVP."

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where RDS will be deployed.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different AZs.

  VpcCidrBlock:
    Type: String
    Default: "10.0.0.0/8"
    Description: CIDR allowed to reach PostgreSQL from ECS tasks inside the VPC.

  DeveloperIpCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: CIDR allowed for local psql testing. For safer use, pass your-ip/32.

  DBName:
    Type: String
    Default: pfs_mvp

  DBUsername:
    Type: String
    Default: itam

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Master password for the PostgreSQL instance.

  SecretName:
    Type: String
    Default: itam/rds/pfs-mvp/credentials

  DBInstanceClass:
    Type: String
    Default: db.t3.micro

  EngineVersion:
    Type: String
    Default: "17.4"

Resources:
  RdsCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Ref SecretName
      Description: RDS PostgreSQL credentials for the Streamlit MVP.
      SecretString: !Sub |
        {
          "username": "${DBUsername}",
          "password": "${DBPassword}",
          "dbname": "${DBName}",
          "port": "5432",
          "engine": "postgres"
        }

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access for Streamlit MVP
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VpcCidrBlock
          Description: PostgreSQL from resources inside the VPC
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref DeveloperIpCidr
          Description: PostgreSQL local developer access for MVP testing

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Streamlit MVP PostgreSQL
      SubnetIds: !Ref SubnetIds

  RdsInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "pfs-mvp-rds-${AWS::AccountId}"
      DBInstanceClass: !Ref DBInstanceClass
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      AllocatedStorage: "20"
      StorageType: gp2
      MultiAZ: false
      PubliclyAccessible: true
      DBSubnetGroupName: !Ref RdsSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      BackupRetentionPeriod: 1
      StorageEncrypted: true
      AutoMinorVersionUpgrade: true

Outputs:
  RdsEndpoint:
    Description: Hostname used in SQLAlchemy connection string.
    Value: !GetAtt RdsInstance.Endpoint.Address

  RdsPort:
    Description: PostgreSQL port.
    Value: !GetAtt RdsInstance.Endpoint.Port

  RdsSecretArn:
    Description: ARN of the Secrets Manager secret.
    Value: !Ref RdsCredentialsSecret

  RdsSecretName:
    Description: Friendly name of the Secrets Manager secret.
    Value: !Ref SecretName

  RdsInstanceId:
    Description: RDS instance identifier.
    Value: !Ref RdsInstance

  RdsSecurityGroupId:
    Description: RDS security group id.
    Value: !Ref RdsSecurityGroup

  ConnectionString:
    Description: SQLAlchemy connection string template without password.
    Value: !Sub "postgresql+psycopg2://${DBUsername}:<password>@${RdsInstance.Endpoint.Address}:5432/${DBName}"
