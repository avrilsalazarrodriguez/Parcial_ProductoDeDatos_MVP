AWSTemplateFormatVersion: "2010-09-09"
Description: "Streamlit app on ECS Fargate with ALB, ModelOps S3 env vars, RDS/Secrets env vars, and CloudWatch logs."

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the ALB and ECS tasks. Minimum 2 subnets in different AZs.

  ImageUri:
    Type: String
    Description: Full ECR image URI, for example account.dkr.ecr.us-east-1.amazonaws.com/pfs-mvp-app:latest.

  ServiceName:
    Type: String
    Default: pfs-mvp
    MaxLength: 20

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0

  Cpu:
    Type: String
    Default: "1024"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]

  Memory:
    Type: String
    Default: "2048"
    AllowedValues: ["512", "1024", "2048", "4096", "8192"]

  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

  ModelBucket:
    Type: String
    Description: S3 bucket with ModelOps outputs.

  ModelOpsPrefix:
    Type: String
    Default: modelops/latest

  ModelOpsRegistryPrefix:
    Type: String
    Default: modelops/registry

  AppExportPrefix:
    Type: String
    Default: app/batch_exports

  RdsStackName:
    Type: String
    Default: pfs-mvp-rds

  RdsSecretName:
    Type: String
    Default: itam/rds/pfs-mvp/credentials

Resources:
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ExecutionSecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameters
                  - kms:Decrypt
                Resource: "*"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StreamlitMvpRuntimePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListModelOpsBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub "arn:aws:s3:::${ModelBucket}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - "modelops/*"
                      - "app/batch_exports/*"
              - Sid: ReadModelOpsOutputs
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${ModelBucket}/modelops/*"
              - Sid: WriteBatchExports
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "arn:aws:s3:::${ModelBucket}/app/batch_exports/*"
              - Sid: ReadRdsSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: "*"
              - Sid: ReadCloudFormationOutputs
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: "*"
              - Sid: PutMetrics
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ServiceName}-cluster"
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ServiceName}"
      RetentionInDays: !Ref LogRetentionDays

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "ALB HTTP access for ${ServiceName}"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from internet

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "ECS task access from ALB for ${ServiceName}"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Traffic from ALB to Streamlit port

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ServiceName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref ALBSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ServiceName}-tg"
      Protocol: HTTP
      Port: 8501
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /_stcore/health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ServiceName
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8501
              Protocol: tcp
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: DISABLE_RDS_WRITES
              Value: "false"
            - Name: RDS_STACK_NAME
              Value: !Ref RdsStackName
            - Name: RDS_SECRET_NAME
              Value: !Ref RdsSecretName
            - Name: USE_MODELOPS_S3
              Value: "true"
            - Name: MODEL_BUCKET
              Value: !Ref ModelBucket
            - Name: MODELOPS_PREFIX
              Value: !Ref ModelOpsPrefix
            - Name: MODELOPS_REGISTRY_PREFIX
              Value: !Ref ModelOpsRegistryPrefix
            - Name: APP_EXPORT_BUCKET
              Value: !Ref ModelBucket
            - Name: APP_EXPORT_PREFIX
              Value: !Ref AppExportPrefix
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8501/_stcore/health || exit 1
            Interval: 30
            Timeout: 10
            Retries: 3
            StartPeriod: 60

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8501
          TargetGroupArn: !Ref TargetGroup
      HealthCheckGracePeriodSeconds: 120

Outputs:
  AppURL:
    Description: Public URL of the Streamlit application.
    Value: !Sub "http://${ALB.DNSName}"

  ALBDNSName:
    Value: !GetAtt ALB.DNSName

  ECSClusterName:
    Value: !Ref ECSCluster

  ECSServiceName:
    Value: !GetAtt ECSService.Name

  LogGroupName:
    Value: !Ref LogGroup

  ECSTaskRoleName:
    Value: !Ref TaskRole

  ECSTaskRoleArn:
    Value: !GetAtt TaskRole.Arn
